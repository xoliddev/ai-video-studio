function seek(t){
 t=Math.max(0,Math.min(DUR,t));
 g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
 g.clearRect(0,0,W,H);g.fillStyle='#050d14';g.fillRect(0,0,W,H);
 const CUTS=[0,L[1].a-0.04,L[2].a-0.03,L[3].a-0.03,L[4].a-0.03,L[5].a-0.03,L[6].a-0.03,L[7].a-0.03,L[8].a-0.03,DUR];
 const FADE=0.45;
 let i=0;while(i<CUTS.length-2&&t>=CUTS[i+1])i++;
 const local=t-CUTS[i];
 const drawAt=(ctx,idx,tt)=>{
  g=ctx;g.save();g.setTransform(1,0,0,1,0,0);
  const lt=tt-CUTS[idx];
  if(idx===0)s1(tt,lt);
  else if(idx===1)s2(tt,lt);
  else if(idx===2)dayScene(tt,lt,DAYS[0],0);
  else if(idx===3)dayScene(tt,lt,DAYS[1],1);
  else if(idx===4)dayScene(tt,lt,DAYS[2],2);
  else if(idx===5)s6(tt,lt);
  else if(idx===6)s7(tt,lt);
  else if(idx===7)s8(tt,lt);
  else s9(tt,lt);
  g.restore();
 };
 drawAt(ga,i,t);
 g=cv.getContext('2d');
 if(i>0&&local<FADE){
  drawAt(gb,i-1,CUTS[i]-0.001);
  g=cv.getContext('2d');g.globalAlpha=1;g.drawImage(bufB,0,0);
  g.globalAlpha=ease(local/FADE);g.drawImage(bufA,0,0);g.globalAlpha=1;
 }else{g.globalAlpha=1;g.drawImage(bufA,0,0);}
 const inA=span(t,0,0.8),outA=1-span(t,DUR-0.9,DUR),f=Math.min(inA,outA);
 if(f<1){g.fillStyle='rgba(4,8,12,'+(1-f)+')';g.fillRect(0,0,W,H);}
}
window.seek=seek;window.READY=true;seek(0);
