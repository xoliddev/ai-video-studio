<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uhud — film</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
  .ui { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
        background: rgba(10, 8, 16, .7); padding: 8px 12px; border-radius: 12px; color: #eee; font-size: 13px; opacity: .35; transition: opacity .3s; }
  .ui:hover { opacity: 1; }
  .ui button { background: #2a2238; color: #f3e6d0; border: 1px solid #4a3a5c; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .ui input { width: 360px; }
  body.render .ui { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0:00</span>
</div>
<audio id="aud" src="narration.wav" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="film.js"></script>
</body>
</html>
