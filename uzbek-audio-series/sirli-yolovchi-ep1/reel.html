<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sirli Yo'lovchi — 1-Qism</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #050508; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 177.77vw; max-width: 56.25vh; max-height: 100vh; display: block; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
  .ui { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; background: rgba(10,12,18,0.85); padding: 10px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-family: 'Montserrat', sans-serif; font-size: 13px; z-index: 100; backdrop-filter: blur(8px); }
  button { background: #222736; color: #f0f0f5; border: 1px solid #3c445c; border-radius: 20px; padding: 6px 14px; cursor: pointer; font: inherit; font-weight: 600; }
  button:hover { background: #32394e; }
  #track { width: 220px; height: 6px; background: #222; border-radius: 3px; position: relative; cursor: pointer; }
  #fill { width: 0%; height: 100%; background: #e09938; border-radius: 3px; }
  #time-disp { min-width: 80px; text-align: center; font-variant-numeric: tabular-nums; opacity: 0.8; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>

<div class="ui" id="ui-bar">
  <button id="btn-play">▶ Ijro</button>
  <div id="track"><div id="fill"></div></div>
  <span id="time-disp">00:00 / 00:00</span>
</div>

<audio id="audio" src="mix.wav" preload="auto"></audio>
<script src="timeline.js"></script>

<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('btn-play');
const track = document.getElementById('track');
const fill = document.getElementById('fill');
const timeDisp = document.getElementById('time-disp');

const TL_DATA = window.TL || { duration: 175.25, lines: [] };
const DURATION = TL_DATA.duration;

// Pseudo-random deterministic generator for consistent frames across renders
function sfc32(a, b, c, d) {
  return function() {
    a |= 0; b |= 0; c |= 0; d |= 0;
    var t = (a + b | 0) + d | 0;
    d = d + 1 | 0;
    a = b ^ b >>> 9;
    b = c + (c << 3) | 0;
    c = c << 21 | c >>> 11;
    c = c + t | 0;
    return (t >>> 0) / 4294967296;
  }
}

// Generate static drops and stars
const rng = sfc32(42, 1337, 8888, 9999);
const RAIN_COUNT = 380;
const rainParticles = [];
for (let i = 0; i < RAIN_COUNT; i++) {
  rainParticles.push({
    x: rng() * W * 1.4 - W * 0.2,
    y: rng() * H,
    len: 25 + rng() * 45,
    speed: 35 + rng() * 30,
    alpha: 0.15 + rng() * 0.35,
    width: 1.2 + rng() * 1.5
  });
}

const GLASS_DROPS_COUNT = 240;
const glassDrops = [];
for (let i = 0; i < GLASS_DROPS_COUNT; i++) {
  glassDrops.push({
    x: rng() * W,
    y: rng() * (H * 0.65),
    r: 1.5 + rng() * 4.5,
    trail: rng() * 20,
    alpha: 0.2 + rng() * 0.5
  });
}

// Smooth interpolation
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// Main render function at timestamp t (seconds)
function seek(t) {
  t = clamp(t, 0, DURATION);

  // Speed dynamics: starts at 70, drops to 15 when stopping for hitchhiker (t=8..14),
  // climbs to 90, and at t=155+ rockets to 145 km/h!
  let speedKmH = 75;
  if (t < 7) {
    speedKmH = 75;
  } else if (t >= 7 && t < 11) {
    speedKmH = lerp(75, 15, (t - 7) / 4);
  } else if (t >= 11 && t < 15) {
    speedKmH = 15;
  } else if (t >= 15 && t < 25) {
    speedKmH = lerp(15, 85, (t - 15) / 10);
  } else if (t >= 25 && t < 150) {
    speedKmH = 85 + Math.sin(t * 0.5) * 5;
  } else {
    speedKmH = lerp(90, 150, Math.min(1, (t - 150) / 15));
  }

  // Clear canvas: Deep midnight blue / dark asphalt
  ctx.fillStyle = '#06080d';
  ctx.fillRect(0, 0, W, H);

  // Horizon & Sky
  const horizonY = H * 0.44;
  const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
  skyGrad.addColorStop(0, '#040508');
  skyGrad.addColorStop(1, '#090d18');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, horizonY);

  // Distant dark trees/hills silhouette
  ctx.fillStyle = '#04060a';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  for (let x = 0; x <= W; x += 60) {
    const treeH = Math.sin(x * 0.008) * 40 + Math.cos(x * 0.02) * 20;
    ctx.lineTo(x, horizonY - 30 - treeH);
  }
  ctx.lineTo(W, horizonY);
  ctx.closePath();
  ctx.fill();

  // Headlights beam projection onto the road
  const roadGrad = ctx.createLinearGradient(0, horizonY, 0, H * 0.75);
  roadGrad.addColorStop(0, '#0b0f19');
  roadGrad.addColorStop(0.3, '#101622');
  roadGrad.addColorStop(0.8, '#1b2230');
  roadGrad.addColorStop(1, '#0e121a');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // Perspective Road
  const roadTopW = 120;
  const roadBottomW = 1180;
  const cx = W * 0.5;

  ctx.fillStyle = '#11151f';
  ctx.beginPath();
  ctx.moveTo(cx - roadTopW / 2, horizonY);
  ctx.lineTo(cx + roadTopW / 2, horizonY);
  ctx.lineTo(cx + roadBottomW / 2, H * 0.75);
  ctx.lineTo(cx - roadBottomW / 2, H * 0.75);
  ctx.closePath();
  ctx.fill();

  // Moving lane divider stripes
  const roadSpeed = (speedKmH / 75) * 12.0;
  const stripeOffset = (t * roadSpeed) % 1.0;
  ctx.fillStyle = 'rgba(230, 235, 245, 0.45)';

  for (let i = 0; i < 9; i++) {
    const k1 = (i + stripeOffset) / 9;
    const k2 = (i + stripeOffset + 0.45) / 9;
    if (k1 < 0 || k2 > 1) continue;

    const y1 = horizonY + Math.pow(k1, 2.2) * (H * 0.75 - horizonY);
    const y2 = horizonY + Math.pow(k2, 2.2) * (H * 0.75 - horizonY);
    const w1 = lerp(4, 28, k1);
    const w2 = lerp(4, 28, k2);

    ctx.beginPath();
    ctx.moveTo(cx - w1 / 2, y1);
    ctx.lineTo(cx + w1 / 2, y1);
    ctx.lineTo(cx + w2 / 2, y2);
    ctx.lineTo(cx - w2 / 2, y2);
    ctx.closePath();
    ctx.fill();
  }

  // Headlight Volumetric Light Cones
  const beamGrad = ctx.createRadialGradient(cx, H * 0.70, 50, cx, horizonY + 60, 480);
  beamGrad.addColorStop(0, 'rgba(240, 245, 255, 0.22)');
  beamGrad.addColorStop(0.5, 'rgba(210, 225, 255, 0.10)');
  beamGrad.addColorStop(1, 'rgba(200, 220, 255, 0)');
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(cx - 240, H * 0.72);
  ctx.lineTo(cx - 40, horizonY + 20);
  ctx.lineTo(cx + 40, horizonY + 20);
  ctx.lineTo(cx + 240, H * 0.72);
  ctx.closePath();
  ctx.fill();

  // Roadside hitchhiker silhouette (visible during t=4s to 12s)
  if (t < 13.5) {
    const kHitch = clamp((t - 4) / 8, 0, 1);
    // Hitchhiker standing on right road shoulder
    const hitchX = lerp(cx + 70, cx + 290, kHitch);
    const hitchY = lerp(horizonY + 10, H * 0.65, kHitch);
    const hitchScale = lerp(0.18, 0.95, kHitch);
    const hitchAlpha = clamp((t - 4) / 1.5, 0, 1) * clamp((13.5 - t) / 1.5, 0, 1);

    ctx.save();
    ctx.globalAlpha = hitchAlpha;
    ctx.translate(hitchX, hitchY);
    ctx.scale(hitchScale, hitchScale);

    // Dark mysterious silhouette
    ctx.fillStyle = '#06080d';
    // Body / Plash coat
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-28, 90);
    ctx.lineTo(32, 90);
    ctx.closePath();
    ctx.fill();
    // Head with old fedora hat
    ctx.beginPath();
    ctx.arc(0, -18, 14, 0, Math.PI * 2);
    ctx.fill();
    // Hat brim
    ctx.fillRect(-22, -26, 44, 5);
    ctx.fillRect(-14, -38, 28, 12);
    // Raised thumb / hand
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#06080d';
    ctx.beginPath();
    ctx.moveTo(-10, 20);
    ctx.lineTo(-42, 5);
    ctx.stroke();

    // Subtle yellow headlight rim on his coat
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255, 230, 180, 0.4)';
    ctx.stroke();

    ctx.restore();
  }

  // Realistic Falling Rain Streaks
  ctx.strokeStyle = 'rgba(215, 230, 255, 0.35)';
  for (let i = 0; i < rainParticles.length; i++) {
    const p = rainParticles[i];
    const yNow = (p.y + t * p.speed * 45) % H;
    const xNow = p.x - (yNow / H) * 80; // Wind slant
    ctx.lineWidth = p.width;
    ctx.beginPath();
    ctx.moveTo(xNow, yNow);
    ctx.lineTo(xNow - 8, yNow + p.len);
    ctx.stroke();
  }

  // Raindrops on Glass
  for (let i = 0; i < glassDrops.length; i++) {
    const d = glassDrops[i];
    const dropY = (d.y + Math.sin(t * 0.2 + i) * 3) % (H * 0.65);
    ctx.fillStyle = `rgba(200, 220, 255, ${d.alpha})`;
    ctx.beginPath();
    ctx.arc(d.x, dropY, d.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Windshield Wipers (t % 1.85)
  const wiperPeriod = 1.85;
  const wipeCycle = (t % wiperPeriod) / wiperPeriod;
  let wipeAngle = 0;
  if (wipeCycle < 0.45) {
    wipeAngle = lerp(-0.75, 0.75, easeInOut(wipeCycle / 0.45));
  } else if (wipeCycle < 0.90) {
    wipeAngle = lerp(0.75, -0.75, easeInOut((wipeCycle - 0.45) / 0.45));
  } else {
    wipeAngle = -0.75;
  }

  // Draw 2 Wipers
  const wiperOrigins = [W * 0.32, W * 0.72];
  for (const ox of wiperOrigins) {
    const oy = H * 0.67;
    const wLen = 340;
    const wx = ox + Math.sin(wipeAngle) * wLen;
    const wy = oy - Math.cos(wipeAngle) * wLen * 0.72;

    ctx.lineWidth = 8;
    ctx.strokeStyle = '#181c24';
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(wx, wy);
    ctx.stroke();

    // Rubber blade
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#0d1016';
    ctx.beginPath();
    ctx.moveTo(wx - 25, wy);
    ctx.lineTo(wx + 25, wy);
    ctx.stroke();
  }

  // Rearview Mirror at Top Center
  const mirrorW = 280, mirrorH = 80;
  const mirrorX = (W - mirrorW) / 2, mirrorY = 70;
  // Mirror frame
  ctx.fillStyle = '#0a0d14';
  ctx.beginPath();
  ctx.roundRect(mirrorX, mirrorY, mirrorW, mirrorH, 16);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#1b212f';
  ctx.stroke();

  // Inside Mirror: Dark rear view with flashing police lights at climax!
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(mirrorX + 6, mirrorY + 6, mirrorW - 12, mirrorH - 12, 12);
  ctx.clip();
  ctx.fillStyle = '#05070c';
  ctx.fillRect(mirrorX, mirrorY, mirrorW, mirrorH);

  if (t >= 153.0) {
    // Red & Blue flashing lights in the mirror!
    const flashPhase = (t * 6.0) % (Math.PI * 2);
    const redIntensity = Math.max(0, Math.sin(flashPhase));
    const blueIntensity = Math.max(0, Math.sin(flashPhase + Math.PI));

    const lightX1 = mirrorX + mirrorW * 0.45;
    const lightX2 = mirrorX + mirrorW * 0.55;
    const lightY = mirrorY + mirrorH * 0.5;

    // Red light glow
    ctx.fillStyle = `rgba(255, 30, 40, ${redIntensity * 0.85})`;
    ctx.beginPath();
    ctx.arc(lightX1, lightY, 24 * redIntensity, 0, Math.PI * 2);
    ctx.fill();

    // Blue light glow
    ctx.fillStyle = `rgba(40, 110, 255, ${blueIntensity * 0.85})`;
    ctx.beginPath();
    ctx.arc(lightX2, lightY, 24 * blueIntensity, 0, Math.PI * 2);
    ctx.fill();

    // Reflection flash inside entire car cabin
    ctx.fillStyle = `rgba(255, 30, 40, ${redIntensity * 0.08})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(40, 110, 255, ${blueIntensity * 0.08})`;
    ctx.fillRect(0, 0, W, H);
  } else {
    // Normal dark highway in mirror
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.moveTo(mirrorX + mirrorW * 0.5 - 15, mirrorY + mirrorH);
    ctx.lineTo(mirrorX + mirrorW * 0.5 + 15, mirrorY + mirrorH);
    ctx.lineTo(mirrorX + mirrorW * 0.5 + 4, mirrorY + 20);
    ctx.lineTo(mirrorX + mirrorW * 0.5 - 4, mirrorY + 20);
    ctx.fill();
  }
  ctx.restore();

  // ================= CAR CABIN & DASHBOARD (Bottom 36%) =================
  const dashY = H * 0.64;
  const dashGrad = ctx.createLinearGradient(0, dashY, 0, H);
  dashGrad.addColorStop(0, '#080a0f');
  dashGrad.addColorStop(0.3, '#0e121a');
  dashGrad.addColorStop(1, '#05070a');
  ctx.fillStyle = dashGrad;
  ctx.beginPath();
  ctx.moveTo(0, dashY);
  ctx.lineTo(W * 0.45, dashY + 40);
  ctx.lineTo(W * 0.55, dashY + 40);
  ctx.lineTo(W, dashY);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Dashboard rim highlight
  ctx.strokeStyle = '#181f2c';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, dashY);
  ctx.lineTo(W * 0.45, dashY + 40);
  ctx.lineTo(W * 0.55, dashY + 40);
  ctx.lineTo(W, dashY);
  ctx.stroke();

  // Instrument Cluster (Speedometer & Tachometer) on Driver's side
  const gaugeX = W * 0.28, gaugeY = dashY + 120, gaugeR = 65;
  ctx.fillStyle = '#06080e';
  ctx.beginPath();
  ctx.arc(gaugeX, gaugeY, gaugeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#1c2434';
  ctx.stroke();

  // Amber glowing ticks
  ctx.strokeStyle = '#e09838';
  ctx.lineWidth = 2;
  for (let a = -Math.PI * 0.75; a <= Math.PI * 0.75; a += Math.PI * 0.15) {
    const gx1 = gaugeX + Math.cos(a) * (gaugeR - 12);
    const gy1 = gaugeY + Math.sin(a) * (gaugeR - 12);
    const gx2 = gaugeX + Math.cos(a) * (gaugeR - 4);
    const gy2 = gaugeY + Math.sin(a) * (gaugeR - 4);
    ctx.beginPath();
    ctx.moveTo(gx1, gy1);
    ctx.lineTo(gx2, gy2);
    ctx.stroke();
  }

  // Speedometer Needle
  const speedAngle = lerp(-Math.PI * 0.75, Math.PI * 0.75, clamp(speedKmH / 180, 0, 1));
  ctx.strokeStyle = '#ff4d4d';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(gaugeX, gaugeY);
  ctx.lineTo(gaugeX + Math.cos(speedAngle) * (gaugeR - 14), gaugeY + Math.sin(speedAngle) * (gaugeR - 14));
  ctx.stroke();

  // Center needle cap
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(gaugeX, gaugeY, 6, 0, Math.PI * 2);
  ctx.fill();

  // Digital Speed display & Clock
  ctx.font = '600 16px Montserrat';
  ctx.fillStyle = '#e09838';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.round(speedKmH)} km/h`, gaugeX, gaugeY + 40);

  // Digital Clock
  const clockMin = Math.floor(14 + t / 60);
  const clockSec = Math.floor(t % 60);
  const timeStr = `02:${clockMin.toString().padStart(2, '0')}`;
  ctx.font = '600 18px Montserrat';
  ctx.fillStyle = '#a0b0d0';
  ctx.fillText(timeStr, W * 0.5, dashY + 80);

  // ================= DRIVER SILHOUETTE (Left) =================
  ctx.fillStyle = '#06070b';
  // Driver head & shoulders
  ctx.beginPath();
  ctx.ellipse(W * 0.18, dashY + 40, 75, 110, -0.05, 0, Math.PI * 2);
  ctx.fill();
  // Driver head profile
  ctx.beginPath();
  ctx.arc(W * 0.17, dashY - 90, 52, 0, Math.PI * 2);
  ctx.fill();

  // Steering wheel
  ctx.lineWidth = 18;
  ctx.strokeStyle = '#0a0d13';
  ctx.beginPath();
  ctx.arc(W * 0.26, dashY + 50, 105, 0, Math.PI * 2);
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.stroke();

  // ================= PASSENGER SILHOUETTE (Right) =================
  // Inside car after t >= 12.5s
  if (t >= 12.5) {
    const enterAlpha = clamp((t - 12.5) / 1.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = enterAlpha;
    ctx.fillStyle = '#06070b';

    // Body
    ctx.beginPath();
    ctx.ellipse(W * 0.82, dashY + 60, 85, 120, 0.08, 0, Math.PI * 2);
    ctx.fill();

    // Head with coat collar and fedora
    ctx.beginPath();
    ctx.arc(W * 0.81, dashY - 80, 50, 0, Math.PI * 2);
    ctx.fill();
    // Hat
    ctx.fillRect(W * 0.81 - 65, dashY - 110, 130, 8);
    ctx.fillRect(W * 0.81 - 42, dashY - 145, 84, 38);

    // MATCH LIGHT SCENE (t=37.5 to t=43.0)
    if (t >= 37.5 && t < 43.0) {
      const matchAlpha = (t < 38.5) ? (t - 37.5) : clamp((43.0 - t) / 1.5, 0, 1);
      const matchX = W * 0.74, matchY = dashY - 40;

      // Warm radial amber flare
      const flare = ctx.createRadialGradient(matchX, matchY, 5, matchX, matchY, 180);
      flare.addColorStop(0, `rgba(255, 190, 80, ${0.9 * matchAlpha})`);
      flare.addColorStop(0.3, `rgba(240, 110, 30, ${0.4 * matchAlpha})`);
      flare.addColorStop(1, 'rgba(200, 50, 10, 0)');
      ctx.fillStyle = flare;
      ctx.beginPath();
      ctx.arc(matchX, matchY, 180, 0, Math.PI * 2);
      ctx.fill();

      // Flame core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(matchX, matchY, 4, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Passenger face profile illuminated by warm match light
      ctx.strokeStyle = `rgba(255, 180, 70, ${0.7 * matchAlpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W * 0.76, dashY - 110);
      ctx.lineTo(W * 0.74, dashY - 85); // Nose
      ctx.lineTo(W * 0.75, dashY - 70); // Lips
      ctx.lineTo(W * 0.74, dashY - 55); // Chin
      ctx.stroke();

      // Smoke curls
      ctx.strokeStyle = `rgba(220, 225, 235, ${0.25 * matchAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(matchX + 5, matchY - 15);
      ctx.bezierCurveTo(matchX + 15, matchY - 45, matchX - 10, matchY - 75, matchX + 20, matchY - 110);
      ctx.stroke();
    }

    // WATCH REVEAL / STEALING GESTURE (t >= 115.0 to 140.0)
    if (t >= 115.0 && t < 142.0) {
      const handAlpha = clamp((t - 115.0) / 1.2, 0, 1) * clamp((142.0 - t) / 1.5, 0, 1);
      ctx.save();
      ctx.globalAlpha = handAlpha;

      // Passenger extended hand into center
      const handX = W * 0.58, handY = dashY + 10;
      ctx.fillStyle = '#06070b';
      ctx.beginPath();
      ctx.ellipse(handX, handY, 28, 16, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // Shimmering Silver Watch on his fingers!
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(handX - 5, handY - 18, 14, 0, Math.PI * 2);
      ctx.stroke();

      // Watch bracelet
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(handX - 5, handY - 32);
      ctx.lineTo(handX - 5, handY - 4);
      ctx.stroke();

      // Sparkle glint on watch face
      const sparkle = (Math.sin(t * 8) + 1) * 0.5;
      ctx.fillStyle = `rgba(255, 255, 255, ${sparkle * 0.9})`;
      ctx.beginPath();
      ctx.arc(handX - 8, handY - 22, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
  }

  // ================= SUBTITLES & DIALOGUE =================
  let currentLine = null;
  for (const line of TL_DATA.lines) {
    if (t >= line.a && t <= line.b) {
      currentLine = line;
      break;
    }
  }

  if (currentLine && t < 168.0) {
    const isDriver = (currentLine.char === 'haydovchi');
    const speakerName = isDriver ? 'HAYDOVCHI' : 'SIRLI YO‘LOVCHI';
    const tagColor = isDriver ? '#7dd3fc' : '#f59e0b';

    // Subtitle Container Box
    const boxY = H * 0.79;
    ctx.save();
    ctx.textAlign = 'center';

    // Speaker Tag Badge
    ctx.font = '700 24px Montserrat';
    ctx.fillStyle = tagColor;
    ctx.fillText(speakerName, W * 0.5, boxY);

    // Dialogue text wrapping
    ctx.font = '600 38px Montserrat';
    ctx.fillStyle = '#ffffff';

    const words = currentLine.text.split(' ');
    let linesArr = [];
    let curLine = '';
    for (const w of words) {
      const test = curLine ? `${curLine} ${w}` : w;
      if (ctx.measureText(test).width > W * 0.86) {
        linesArr.push(curLine);
        curLine = w;
      } else {
        curLine = test;
      }
    }
    if (curLine) linesArr.push(curLine);

    for (let li = 0; li < linesArr.length; li++) {
      const lineY = boxY + 54 + (li * 50);
      // Soft text glow/shadow for maximum readability against background
      ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 3;
      ctx.fillText(linesArr[li], W * 0.5, lineY);
    }
    ctx.restore();
  }

  // ================= INTRO & OUTRO TITLE CARDS =================
  // Intro (t=0 to t=4.5)
  if (t < 4.5) {
    const introAlpha = (t < 1.0) ? t : clamp((4.5 - t) / 1.0, 0, 1);
    ctx.save();
    ctx.globalAlpha = introAlpha;
    ctx.fillStyle = 'rgba(4, 6, 10, 0.75)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = '700 52px Cinzel';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText('SIRLI YO‘LOVCHI', W * 0.5, H * 0.46);

    ctx.font = '600 26px Montserrat';
    ctx.fillStyle = '#d97706';
    ctx.fillText('1-QISM  ·  TUNGI SHOSSE', W * 0.5, H * 0.50);

    ctx.font = '400 22px Montserrat';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Roald Dahl asari asosida', W * 0.5, H * 0.54);
    ctx.restore();
  }

  // Outro Cliffhanger (t >= 168.0)
  if (t >= 168.0) {
    const outroAlpha = clamp((t - 168.0) / 1.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = outroAlpha;
    ctx.fillStyle = '#030407';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = '700 58px Cinzel';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText('1-QISM TUGADI', W * 0.5, H * 0.46);

    ctx.font = '600 32px Montserrat';
    ctx.fillStyle = '#f59e0b';
    ctx.fillText('DAVOMI BOR...', W * 0.5, H * 0.52);

    ctx.font = '400 22px Montserrat';
    ctx.fillStyle = '#64748b';
    ctx.fillText('Keyingi qismda: Politsiya bilan to‘qnashuv', W * 0.5, H * 0.58);
    ctx.restore();
  }
}

// Setup Interactive Playback for browser testing
window.READY = true;
window.seek = seek;

// Initial frame
seek(0);

// Audio UI bindings
playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = '⏸ Pauza';
  } else {
    audio.pause();
    playBtn.textContent = '▶ Ijro';
  }
});

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime;
  seek(cur);
  const pct = (cur / DURATION) * 100;
  fill.style.width = pct + '%';
  timeDisp.textContent = `${formatTime(cur)} / ${formatTime(DURATION)}`;
});

track.addEventListener('click', e => {
  const rect = track.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audio.currentTime = ratio * DURATION;
  seek(audio.currentTime);
});

audio.addEventListener('ended', () => {
  playBtn.textContent = '▶ Boshidan';
});
</script>
